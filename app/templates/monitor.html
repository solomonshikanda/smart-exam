{% extends "base.html" %}
{% block title %}Proctor Monitor{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>
  .student-box { border-radius:10px; border:1px solid #ddd; background:#fff; padding:16px; }
  video { width:100%; max-height:360px; border-radius:8px; background:#000; }
  .status { font-weight:600; }
  .status-ok { color: green; }
  .status-alert { color: red; }
</style>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 student-box">
      <h5 id="student-email">{{ email or "student@example.com" }}</h5>
      <video id="camera" autoplay muted playsinline></video>
      <p class="mt-3">
        Tab Status: <span id="tab-status" class="status status-ok">Focused</span><br>
        Voice Detected: <span id="voice-status" class="status status-ok">No</span><br>
        Last Snapshot: <span id="last-snapshot">never</span><br>
      </p>
      <div class="mt-2">
        <button id="force-snapshot" class="btn btn-sm btn-outline-primary">Force Snapshot</button>
        <button id="calibrate-noise" class="btn btn-sm btn-outline-secondary">Calibrate Noise</button>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3">
        <h6>Settings</h6>
        <div class="form-group">
          <label>Snapshot interval (sec)</label>
          <input id="snapshot-interval" class="form-control" type="number" value="30" min="5" />
        </div>
        <div class="form-group">
          <label>Noise threshold (RMS)</label>
          <input id="noise-threshold" class="form-control" type="number" value="0.02" step="0.005" />
        </div>
        <div class="form-group">
          <label>Record duration (ms)</label>
          <input id="audio-duration" class="form-control" type="number" value="4000" />
        </div>
        <div class="form-group">
          <label>Use server upload fallback</label>
          <select id="server-fallback" class="form-control">
            <option value="false" selected>Client (Firebase) upload</option>
            <option value="true">Server upload (/api/upload_media)</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- include your modular firebase-app.js before monitor-client.js -->
<script type="module" src="{{ url_for('static', path='js/firebase-app.js') }}"></script>
<!-- then include this monitor-client script -->
<script type="module" src="{{ url_for('static', path='js/monitor-client.js') }}"></script>

{% endblock %}
