<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SMART-EXAM{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            padding-top: 60px;
        }
        .navbar {
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .nav-link.active {
            font-weight: bold;
            color: #fff !important;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="/">SMART-EXAM</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                {% if email != 'admin@co.uk' %}
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/exams') %}active{% endif %}" href="/exams">Exams</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/dashboard') %}active{% endif %}" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/exams') %}active{% endif %}" href="/exams">Exams</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/grading') %}active{% endif %}" href="/grading">Grading</a>
                </li>
                {% endif %}
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/logout') %}active{% endif %}" href="/logout" >Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center mt-5 mb-3 text-muted">
        <p>&copy; 2025 SMART-EXAM System. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
