<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script type="module" src="/static/js/firebase-app.js"></script>
    <link rel="stylesheet" href="/static/css/login.css">
    <style>
        body {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStzapBqcPhMKDLg2YgTi6M8mvfOJRJSxNt0DJ1QBi9IBhEye_ifMbI4EhpVMo7ZzzMgG0&usqp=CAU');
            background-size: cover;
            background-position: center;
            font-family: 'Roboto', sans-serif;
            background-attachment: fixed;
        }

        .navbar {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .container {
            margin-top: 120px;
        }

        .jumbotron {
            background-color: rgba(0, 0, 20, 0.85);
            border-radius: 100px 0px 100px 0px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
        }

        .login-container {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 8, 0.1);
            margin-top: 30px;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
        }

        .form-control {
            border-radius: 5px;
            padding: 15px;
            border: 1px solid #ddd;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-danger {
            background-color: #e74c3c;
            border: none;
            width: 100%;
            border-radius: 5px;
            padding: 12px;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        p {
            font-size: 1rem;
            color: #555;
        }

        a {
            color: #007bff;
            font-weight: bold;
        }

        a:hover {
            color: #0056b3;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="/">SMART-EXAM</a>
    </nav>

    <main role="main" class="container">
        <div class="jumbotron">
            <h1>Register</h1>
            <div id="auth-box" class="login-container">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password">
                </div>
                <button id="sign-up" class="btn btn-success">Sign Up</button>
                <p class="mt-3">Already have an account? <a href="/login">Login</a></p>
            </div>
            <button id="sign-out" class="btn btn-danger mt-3" style="display: none;">Sign Out</button>
        </div>
    </main>


</body>

</html>
